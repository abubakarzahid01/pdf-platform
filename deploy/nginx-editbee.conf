# nginx for editbee.online. Cloudflare sits in front; the firewall only lets Cloudflare reach ports 80 and 443.

# Visitors' real addresses (Cloudflare passes them on). Written by cloudflare-ips.sh.
include /etc/nginx/cloudflare-realip.conf;

# Each visitor can start about 10 conversions a minute, with short bursts allowed.
limit_req_zone $binary_remote_addr zone=convert:10m rate=10r/m;
limit_req_status 429;

# Requests for the server's bare IP address or an unknown name get nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name editbee.online www.editbee.online;
    return 301 https://editbee.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.editbee.online;
    ssl_certificate     /etc/ssl/editbee/origin.pem;
    ssl_certificate_key /etc/ssl/editbee/origin.key;
    return 301 https://editbee.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name editbee.online;
    ssl_certificate     /etc/ssl/editbee/origin.pem;
    ssl_certificate_key /etc/ssl/editbee/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # The converter, at /converter/... on the same address as the site (so no CORS is needed).
    location = /converter/convert {
        limit_req zone=convert burst=10 nodelay;
        # A little above the converter's own 50 MB limit, so it can explain the limit itself.
        client_max_body_size 51m;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_pass http://127.0.0.1:4000/convert;
    }
    location = /converter/health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
